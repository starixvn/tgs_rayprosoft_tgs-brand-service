apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "brand-api.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "brand-api.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "brand-api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "brand-api.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if eq .Values.namespace "staging" }}
      nodeSelector:
        dedicated: nonprod
      tolerations:
      - effect: NoSchedule
        key: dedicated
        operator: Equal
        value: nonprod
      {{- end }}
      {{- if eq .Values.namespace "prod" }}
      nodeSelector:
        dedicated: prod
      tolerations:
      - effect: NoSchedule
        key: dedicated
        operator: Equal
        value: prod
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          env:
            - name: OTEL_SERVICE_NAME
              value: Brand-Api({{ .Release.Namespace }})
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: ConnectionStrings__Tgs
              valueFrom:
                secretKeyRef:
                  name: tgs-connections
                  key: tgs
            - name: ConnectionStrings__Redis
              valueFrom:
                secretKeyRef:
                  name: tgs-connections
                  key: redis
            - name: ConnectionStrings__Nats
              valueFrom:
                secretKeyRef:
                  name: tgs-connections
                  key: nats
          volumeMounts:
            - mountPath: /app/appsettings.Production.json
              name: appsettings
              readOnly: true
              subPath: appsettings.json
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
        - name: monitor
          image: otel/opentelemetry-collector:0.62.1
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --config=/etc/otel/config.yaml
          env:
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          ports:
            - name: metrics
              containerPort: 8889
              protocol: TCP
            - name: health
              containerPort: 13133
              protocol: TCP
            - name: otlp
              containerPort: 4317
              protocol: TCP
          volumeMounts:
            - mountPath: /etc/otel/config.yaml
              name: appsettings
              readOnly: true
              subPath: otel-collector-config.yaml
          startupProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 5
          resources:
            {{- toYaml .Values.monitorResources | nindent 12 }}
      volumes:
        - name: appsettings
          configMap:
            name: configmap-{{ include "brand-api.fullname" . }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
